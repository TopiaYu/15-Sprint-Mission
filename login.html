<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable.min.css" />
    <link rel="stylesheet" href="login.css">
    <title>Document</title>
</head>
<body>
    <container>
        <div id="logo">
            <a href="index.html">
                <img src="./image/판다얼굴.png">
                <img src="./image/판다마켓.png">
            </a>    
        </div>
        <form>
            <lable>이메일</lable>
            <input type="email" name="user-email" placeholder="이메일을 입력해주세요">
            <lable>비밀번호</lable>
            <input type="password" name="user-password" placeholder="비밀번호를 입력해주세요">
            <div class="login-button">
                로그인
            </div>
        </form>
        <div class="sns-login">
            <p>간편 로그인하기</p>
            <div class="sns-login-image">
                <a href="https://www.google.com/">
                    <img src="./image/google_logo.png" alt="구글로그인">
                </a>
                <a href="https://www.kakaocorp.com/page/">
                    <img src="./image/kakao_logo.png" alt="카카오톡 로그인">
                </a>
            </div>
        </div>
        <div class="footer">
            <p>판다마켓이 처음인가요?</p>
            <a href="./signup.html">회원가입</a>
        </div>
    </container>
</body>
</html>
